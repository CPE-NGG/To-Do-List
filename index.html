<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="To Do List.css">
</head>
<body>
  <div class="todo-container">
    <h2>To-Do List</h2>

    <div id="notification"></div>

    <div class="todo-content">

      <form id="taskForm" class="input-row">
        <div class="form-group">
          <label for="taskInput">Task Name</label>
          <input type="text" id="taskInput" placeholder="Enter task..." required>
        </div>
        <div class="form-group">
          <label for="prioritySelect">Priority</label>
          <select id="prioritySelect">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dueDate">Deadline (Date)</label>
          <input type="date" id="dueDate">
        </div>
        <div class="form-group">
          <label for="dueTime">Deadline (Time)</label>
          <input type="time" id="dueTime">
        </div>
        <button type="submit" class="add-btn">Add</button>
      </form>

      <div class="search-bar">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Search tasks...">
      </div>

      <div class="task-table-container">
        <table id="taskTable">
          <thead>
            <tr>
              <th>Done</th>
              <th data-sort="task">Task <span class="indicator">⇅</span></th>
              <th data-sort="priority">Priority <span class="indicator">⇅</span></th>
              <th data-sort="deadline">Deadline <span class="indicator">⇅</span></th>
              <th data-sort="timeLeft">Time Left <span class="indicator">⇅</span></th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table>
      </div>

    </div>

    <div class="footer">
      <span id="taskCounter">0 tasks</span>
      <div class="footer-buttons">
        <button id="undoBtn" class="undo-btn" title="Undo Action">Undo</button>
        <button id="exportBtn" class="export-btn" title="Export to JSON">Export</button>
        <button id="importBtn" class="import-btn" title="Import from JSON">Import</button>
        <button id="clearAllBtn" class="clear-btn" title="Clear All Tasks">Clear All</button>
      </div>
    </div>

    <div class="stats" id="statsPanel"></div>
  </div>

  <div id="appModal" class="modal">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">Confirm</div>
      <div class="modal-body" id="modalMessage">Are you sure?</div>
      <div class="modal-footer">
        <button class="modal-btn confirm" id="modalConfirmBtn">OK</button>
        <button class="modal-btn cancel" id="modalCancelBtn">Cancel</button>
      </div>
    </div>
  </div>
  <script src="To Do List.js">  
  </script>
  <div id="infoModal" class="modal">
  <div class="modal-content">
    <div class="modal-header" id="infoModalTitle">Info</div>
    <div class="modal-body" id="infoModalMessage">Success!</div>
    <div class="modal-footer">
      <button class="modal-btn confirm" id="infoModalOkBtn">OK</button>
    </div>
  </div>
  </div>
  <button id="notesBtn" class="notes-btn">Notes</button>
  <div id="notesPanel" class="notes-panel">
    <h3>📝 Notes</h3>
    <textarea id="notesContent" placeholder="Write your notes here..."></textarea>
  </div>
</body>
</html>
